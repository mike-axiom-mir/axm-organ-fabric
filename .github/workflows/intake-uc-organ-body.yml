name: Verified Universal Creation organ body intake

on:
  push:
    branches:
      - chatgpt/platform-text-organ-intake
    paths:
      - .github/workflows/intake-uc-organ-body.yml

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Organ Fabric
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pinned Universal Creation donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: 90148a8cde5349bb4b3801b3256859a631fbf9a6
          path: _uc
          persist-credentials: false

      - name: Verify donor revision and copy bodies
        shell: bash
        run: |
          set -euo pipefail
          expected="90148a8cde5349bb4b3801b3256859a631fbf9a6"
          observed="$(git -C _uc rev-parse HEAD)"
          test "$observed" = "$expected" || { echo "SOURCE_MOVED expected=$expected observed=$observed"; exit 1; }
          target="intakes/universal-creation-organs"
          rm -rf "$target"
          mkdir -p "$target"
          rsync -a _uc/organs/ "$target/organs/"
          rsync -a _uc/executable-organs/ "$target/executable-organs/"
          cp _uc/EXECUTABLE_ORGANS.md "$target/EXECUTABLE_ORGANS.md"
          cp _uc/ORGAN_ASSEMBLY.md "$target/ORGAN_ASSEMBLY.md"
          cp _uc/ORGAN_MATERIALIZATION.md "$target/ORGAN_MATERIALIZATION.md"

      - name: Verify exact bytes and build cross-body catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          donor=Path('_uc')
          target=Path('intakes/universal-creation-organs')
          rels=[]
          for root in ['organs','executable-organs']:
              for p in sorted((donor/root).rglob('*')):
                  if p.is_file(): rels.append(p.relative_to(donor))
          rels += [Path('EXECUTABLE_ORGANS.md'),Path('ORGAN_ASSEMBLY.md'),Path('ORGAN_MATERIALIZATION.md')]
          rows=[]
          for rel in sorted(set(rels), key=lambda p:p.as_posix()):
              src=donor/rel; dst=target/rel
              if not dst.is_file(): raise SystemExit(f'MISSING_COPY:{rel.as_posix()}')
              a=src.read_bytes(); b=dst.read_bytes()
              if a != b: raise SystemExit(f'BYTE_MISMATCH:{rel.as_posix()}')
              rows.append({'path':rel.as_posix(),'bytes':len(a),'sha256':hashlib.sha256(a).hexdigest()})

          anatomy=[]; anatomy_ids=set()
          for p in sorted((target/'organs').glob('*.json')):
              d=json.loads(p.read_text())
              oid=d.get('id')
              if not oid: raise SystemExit(f'MISSING_ANATOMY_ID:{p.name}')
              if oid in anatomy_ids: raise SystemExit(f'DUPLICATE_ANATOMY_ID:{oid}')
              anatomy_ids.add(oid)
              anatomy.append({'file':p.name,'id':oid,'status':d.get('status','unspecified')})

          executable=[]; refs=set()
          for p in sorted((target/'executable-organs').glob('*.json')):
              d=json.loads(p.read_text())
              oid=d.get('id'); version=d.get('version')
              if not oid or not version: raise SystemExit(f'MISSING_EXECUTABLE_IDENTITY:{p.name}')
              ref=f'{oid}@{version}'
              if ref in refs: raise SystemExit(f'DUPLICATE_EXECUTABLE_REF:{ref}')
              refs.add(ref)
              executable.append({'file':p.name,'id':oid,'version':version,'ref':ref,'status':d.get('status','unspecified'),'schema':d.get('schema')})

          if len(anatomy) != 415: raise SystemExit(f'ANATOMY_COUNT_DRIFT expected=415 observed={len(anatomy)}')
          if len(executable) != 15: raise SystemExit(f'EXECUTABLE_COUNT_DRIFT expected=15 observed={len(executable)}')
          digest=hashlib.sha256(''.join(f"{r['path']}\0{r['bytes']}\0{r['sha256']}\n" for r in rows).encode()).hexdigest()
          receipt={
              'schema':'axm.organ-fabric.intake/v1',
              'source_repository':'mike-axiom-mir/axm-universal-creation',
              'source_commit':'90148a8cde5349bb4b3801b3256859a631fbf9a6',
              'target_repository':'mike-axiom-mir/axm-organ-fabric',
              'target_root':'intakes/universal-creation-organs',
              'descriptive_organ_count':len(anatomy),
              'executable_organ_count':len(executable),
              'copied_file_count':len(rows),
              'copied_bytes':sum(r['bytes'] for r in rows),
              'aggregate_manifest_sha256':digest,
              'copy_verified_byte_exact':True,
              'donor_mutated':False,
              'authority_change':False,
              'verification_ceiling':'exact donor body, identity census and package presence; semantic interface correctness and generated-runtime execution are not newly claimed',
          }
          (target/'INTAKE_RECEIPT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (target/'CATALOG.json').write_text(json.dumps({'schema':'axm.organ-catalog/v1','descriptive':anatomy,'executable':executable},indent=2,sort_keys=True)+'\n')
          PY

          cat > intakes/universal-creation-organs/index.js <<'EOF'
          'use strict';
          const fs=require('fs');
          const path=require('path');
          const root=__dirname;
          function readJson(dir,name){ return JSON.parse(fs.readFileSync(path.join(root,dir,name),'utf8')); }
          function descriptive(){ return fs.readdirSync(path.join(root,'organs')).filter(x=>x.endsWith('.json')).sort().map(n=>({file:n,...readJson('organs',n)})); }
          function executable(){ return fs.readdirSync(path.join(root,'executable-organs')).filter(x=>x.endsWith('.json')).sort().map(n=>({file:n,...readJson('executable-organs',n)})); }
          function getExecutable(id,version){ return executable().find(o=>o.id===id && o.version===version)||null; }
          module.exports={descriptive,executable,getExecutable};
          EOF

          cat > intakes/universal-creation-organs/README.md <<'EOF'
          # Universal Creation organ-body intake

          Byte-exact intake of Universal Creation's complete descriptive `organs/` body and installed `executable-organs/` package body at the pinned donor revision.

          The donor itself distinguishes descriptive anatomy from executable package evidence; this Fabric preserves that distinction. Intake does not turn 415 descriptions into 415 implementations and does not expand the donor's verification ceiling.
          EOF

      - name: Smoke-test census and exact executable lookup
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const body=require('./intakes/universal-creation-organs');
          const anatomy=body.descriptive();
          const executable=body.executable();
          if(anatomy.length!==415) throw new Error('descriptive organ census drift');
          if(executable.length!==15) throw new Error('executable organ census drift');
          for(const organ of executable){
            const found=body.getExecutable(organ.id,organ.version);
            if(!found || found.file!==organ.file) throw new Error('exact executable lookup failed');
          }
          console.log('UC_ORGAN_BODY_OK descriptive='+anatomy.length+' executable='+executable.length);
          NODE

      - name: Commit verified intake
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _uc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intakes/universal-creation-organs
          if git diff --cached --quiet; then
            echo "No intake changes"
            exit 0
          fi
          git commit -m "Import Universal Creation organ body"
          git push origin HEAD:${GITHUB_REF_NAME}
